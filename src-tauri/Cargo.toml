[package]
name = "mistria-tracker"
version = "0.1.7"
description = "Native Fields of Mistria tracker"
authors = ["Mistria Tracker"]
edition = "2021"

[lib]
name = "mistria_tracker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
png = "0.17"
flate2 = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
toml = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
tauri = { version = "2", features = [] }
uuid = { version = "1", features = ["serde", "v4"] }
zip = { version = "2.4", default-features = false, features = ["deflate"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
tauri-plugin-dialog = "2.7.3"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
